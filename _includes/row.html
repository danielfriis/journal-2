<a href="{{ include.url }}"{% if include.external %} target="_blank" rel="noopener"{% endif %} class="group flex flex-row py-1 transition-transform duration-200 hover:translate-x-1.5">
  <span class="w-20 shrink-0 leading-6 text-sm font-light text-zinc-500">{{ include.meta }}</span>
  <span>
    <span class="leading-6 text-zinc-700 dark:text-zinc-200 dark:font-light group-hover:text-black dark:group-hover:text-white">
      {{ include.title }}<span class="ml-1 text-zinc-400 opacity-0 transition-opacity group-hover:opacity-100">{% if include.external %}↗{% else %}→{% endif %}</span>
    </span>
    {% if include.desc %}<span class="block mb-2 text-sm default-text-styling">{{ include.desc }}</span>{% endif %}
  </span>
</a>
